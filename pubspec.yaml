name: micut
description: MiCut - 장면을 이해해 미쿠를 자동 배치하는 카메라 앱
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  camera: ^0.11.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  gal: ^2.3.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 앱 아이콘 / 스플래시 생성기. `dart run flutter_launcher_icons`, `dart run flutter_native_splash:create`
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/samples/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700

# 앱 아이콘: Figma "MiCut Icon M" (일렉트릭 시안 배경 + 검정 M)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_1024.png
  adaptive_icon_background: "#00FAFC"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png

# 스플래시: 로고와 같은 순흑 + 시안 워드마크
flutter_native_splash:
  color: "#0B0B0B"
  image: assets/brand/logo_wordmark_cyan.png
  android_12:
    color: "#0B0B0B"
    image: assets/brand/app_icon_foreground.png
    icon_background_color: "#00FAFC"
