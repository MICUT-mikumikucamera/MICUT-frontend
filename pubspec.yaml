publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter_localizations:
    sdk: flutter
  http_parser: ^4.1.2
  web: ^1.1.1
  camera: ^0.12.2
  flutter:
    sdk: flutter
  gal: ^2.3.3
  http: ^1.6.0
  image: ^4.12.0
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
